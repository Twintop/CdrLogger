name: Checks

# Offline checks. Runs on every pull request and branch push, and release.yml calls it before staging a tag.
# Nothing here loads the game client: it catches Lua syntax errors, not in-game behavior.

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null

      - name: Syntax-check every Lua file
        shell: bash
        run: |
          status=0
          while IFS= read -r f; do
            luac5.1 -p "$f" || status=1
          done < <(git ls-files '*.lua')
          exit $status

      - name: Require every TOC file entry to exist
        shell: bash
        run: |
          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || { echo "CdrLogger.toc lists $f, which does not exist"; status=1; }
          done < <(tr -d '\r' < CdrLogger.toc | sed 's/^\xEF\xBB\xBF//' | grep -v '^#' | sed 's/[[:space:]]*$//' | grep -v '^$' | tr '\134' '/')
          exit $status
